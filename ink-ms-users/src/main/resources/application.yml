# src/main/resources/application.yml

spring:
  application:
    name: ink-ms-users
  
  # Base de datos del módulo users (perfil, roles, actividad).
  datasource:
    url: jdbc:mysql://localhost:3306/user_ms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 3002

# Debe coincidir con la secret de auth para validar tokens emitidos por ese MS.
jwt:
  secret: inklusport2024superSecretKeyForJWTtokenGenerationWith512bitsAlgorithmHS512
  expiration: 86400000 # 24h en milisegundos.

logging:
  level:
    com.inklusport.users: DEBUG

# URL del Auth MS (para Feign Client)
auth:
  service:
    url: http://localhost:3001 # Usado para validaciones/consultas entre microservicios.
# src/main/resources/application.yml

spring:
  application:
    name: ink-ms-users
  
  # Base de datos del módulo users (perfil, roles, actividad).
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${SERVER_PORT}

# Debe coincidir con la secret de auth para validar tokens emitidos por ese MS.
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION} # 24h en milisegundos.

logging:
  level:
    com.inklusport.users: ${LOG_LEVEL}

# URL del Auth MS (para Feign Client)
auth:
  service:
    url: ${AUTH_SERVICE_URL} # Usado para validaciones/consultas entre microservicios.
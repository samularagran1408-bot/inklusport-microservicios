# Config JWT compartida con MS que validan el token.
jwt:
  secret: inklusport2024superSecretKeyForJWTtokenGenerationWith512bitsAlgorithmHS512
  expiration: 86400000 # 24h en milisegundos.

app:
  password-reset:
    mail-enabled: true # true: envía correo real. false: solo log de token para pruebas.
    expose-token-in-response: false # true solo para testing local (no recomendado en producción).
    token-expiry-hours: 24 # Tiempo de vida del token de recuperación.


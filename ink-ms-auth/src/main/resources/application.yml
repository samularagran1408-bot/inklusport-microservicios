# ============================================================
# application.yml - ink-ms-auth
# Configuración con variables de entorno
# ============================================================

spring:
  application:
    name: ink-ms-auth
  
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: ${MAIL_PROTOCOL}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
  
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${SERVER_PORT}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

app:
  password-reset:
    mail-enabled: ${MAIL_ENABLED}
    expose-token-in-response: ${EXPOSE_TOKEN}
    token-expiry-hours: ${TOKEN_EXPIRY_HOURS}

users:
  service:
    url: ${USERS_SERVICE_URL}

feign:
  circuitbreaker:
    enabled: ${FEIGN_CIRCUITBREAKER}

logging:
  level:
    com.inklusport.auth: ${LOG_LEVEL}
# src/main/resources/application.yml

spring:
  application:
    name: ink-ms-auth
  
  datasource:
    url: jdbc:mysql://localhost:3306/auth_ms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: tu-email@gmail.com
    password: tu-contraseña
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 3001

jwt:
  secret: inklusport2024superSecretKeyForJWTtokenGenerationWith512bitsAlgorithmHS512
  expiration: 86400000

app:
  password-reset:
    mail-enabled: false
    expose-token-in-response: true
    token-expiry-hours: 24

users:
  service:
    url: http://localhost:3002

logging:
  level:
    com.inklusport.auth: DEBUG
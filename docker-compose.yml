version: "3.8"

networks:
  inklusport-network:
    driver: bridge

services:
  # ==========================================
  # 1. BASES DE DATOS
  # ==========================================
  mongodb:
    image: mongo:6.0
    container_name: inklusport-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    networks:
      - inklusport-network

  mysql:
   image: mysql:8.0
   container_name: inklusport-mysql
   restart: always
   ports:
    - "3306:3306"
   environment:
    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
   volumes:
    - ./init-mysql:/docker-entrypoint-initdb.d
   networks:
    - inklusport-network

  # ==========================================
  # 2. MICROSERVICIOS DE SPRING BOOT
  # ==========================================
  gateway-service:
    build:
      context: ./backend/ink-ms-gateway
      dockerfile: Dockerfile
    container_name: ink-ms-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
    networks:
      - inklusport-network

  auth-service:
    build:
      context: ./backend/ink-ms-auth
      dockerfile: Dockerfile
    container_name: ink-ms-auth
    ports:
      - "3001:3001"
    depends_on:
      - mysql
    networks:
      - inklusport-network

  users-service:
    build:
      context: ./backend/ink-ms-users
      dockerfile: Dockerfile
    container_name: ink-ms-users
    ports:
      - "3002:3002"
    depends_on:
      - mysql
    networks:
      - inklusport-network

  admin-service:
    build:
      context: ./backend/ink-ms-admin
      dockerfile: Dockerfile
    container_name: ink-ms-admin
    ports:
      - "3004:3004"
    depends_on:
      - mysql
    networks:
      - inklusport-network

  sports-service:
    build:
      context: ./backend/ink-ms-sports
      dockerfile: Dockerfile
    container_name: ink-ms-sports
    ports:
      - "3003:3003"
    depends_on:
      - mysql
    networks:
      - inklusport-network

  accessibility-service:
    build:
      context: ./backend/ink-ms-accesibility
      dockerfile: Dockerfile
    container_name: ink-ms-accessibility
    ports:
      - "3006:3006"
    depends_on:
      - mongodb
    networks:
      - inklusport-network

  reports-service:
    build:
      context: ./backend/ink-ms-reports
      dockerfile: Dockerfile
    container_name: ink-ms-reports
    ports:
      - "3007:3007"
    depends_on:
      - mysql
    networks:
      - inklusport-network

  ai-service:
    build:
      context: ./backend/ink-ms-ai-assistant
      dockerfile: Dockerfile
    container_name: ink-ms-ai
    ports:
      - "3008:3008"
    networks:
      - inklusport-network
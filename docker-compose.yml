# Inklusport — Docker Compose
#
# Core stack (auth, users, sports, gateway + MySQL):
#   docker compose up --build
#
# Full stack (+ reports, admin, accessibility, AI + extra DBs):
#   docker compose --profile full up --build

services:
  # --- Databases (core) ---
  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: auth_ms
    ports:
      - "3306:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql
    networks:
      - inklusport-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-user:
    image: mysql:8.0
    container_name: mysql-user
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: user_ms
    ports:
      - "3307:3306"
    volumes:
      - mysql-user-data:/var/lib/mysql
    networks:
      - inklusport-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-sports:
    image: mysql:8.0
    container_name: mysql-sports
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: sports_events_ms
    ports:
      - "3308:3306"
    volumes:
      - mysql-sports-data:/var/lib/mysql
    networks:
      - inklusport-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Databases (profile: full) ---
  mysql-reports:
    profiles: ["full"]
    image: mysql:8.0
    container_name: mysql-reports
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: reports_db
    ports:
      - "3309:3306"
    volumes:
      - mysql-reports-data:/var/lib/mysql
    networks:
      - inklusport-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-admin:
    profiles: ["full"]
    image: mysql:8.0
    container_name: mysql-admin
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: admin_ms
    ports:
      - "3310:3306"
    volumes:
      - mysql-admin-data:/var/lib/mysql
    networks:
      - inklusport-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongo:
    profiles: ["full"]
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - inklusport-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Microservices (core) ---
  ink-ms-auth:
    build:
      context: .
      dockerfile: ink-ms-auth/Dockerfile
    container_name: ink-ms-auth
    ports:
      - "3001:3001"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql-auth
      DB_PORT: 3306
      DB_NAME: auth_ms
      DB_USERNAME: root
      DB_PASSWORD: root123
      USERS_SERVICE_URL: http://ink-ms-users:3002
    depends_on:
      mysql-auth:
        condition: service_healthy
    networks:
      - inklusport-net
    restart: unless-stopped

  ink-ms-users:
    build:
      context: .
      dockerfile: ink-ms-users/Dockerfile
    container_name: ink-ms-users
    ports:
      - "3002:3002"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql-user
      DB_PORT: 3306
      DB_NAME: user_ms
      DB_USERNAME: root
      DB_PASSWORD: root123
      AUTH_SERVICE_URL: http://ink-ms-auth:3001
    depends_on:
      mysql-user:
        condition: service_healthy
      ink-ms-auth:
        condition: service_started
    networks:
      - inklusport-net
    restart: unless-stopped

  ink-ms-sports:
    build:
      context: ./ink-ms-sports
      dockerfile: Dockerfile
    container_name: ink-ms-sports
    ports:
      - "3003:3003"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql-sports
      DB_PORT: 3306
      DB_NAME: sports_events_ms
      DB_USERNAME: root
      DB_PASSWORD: root123
      USERS_SERVICE_URL: http://ink-ms-users:3002
    depends_on:
      mysql-sports:
        condition: service_healthy
      ink-ms-users:
        condition: service_started
    networks:
      - inklusport-net
    restart: unless-stopped

  ink-ms-gateway:
    build:
      context: .
      dockerfile: ink-ms-gateway/Dockerfile
    container_name: ink-ms-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_SERVICE_URL: http://ink-ms-auth:3001
      USERS_SERVICE_URL: http://ink-ms-users:3002
      SPORTS_SERVICE_URL: http://ink-ms-sports:3003
    depends_on:
      - ink-ms-auth
      - ink-ms-users
      - ink-ms-sports
    networks:
      - inklusport-net
    restart: unless-stopped

  # --- Microservices (profile: full) ---
  ink-ms-reports:
    profiles: ["full"]
    build:
      context: .
      dockerfile: ink-ms-reports/Dockerfile
    container_name: ink-ms-reports
    ports:
      - "3006:3006"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql-reports
      DB_PORT: 3306
      DB_NAME: reports_db
      DB_USERNAME: root
      DB_PASSWORD: root123
    depends_on:
      mysql-reports:
        condition: service_healthy
    networks:
      - inklusport-net
    restart: unless-stopped

  ink-ms-admin:
    profiles: ["full"]
    build:
      context: ./ink-ms-admin
      dockerfile: Dockerfile
    container_name: ink-ms-admin
    ports:
      - "3005:3005"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql-admin
      DB_PORT: 3306
      DB_NAME: admin_ms
      DB_USERNAME: root
      DB_PASSWORD: root123
      USERS_SERVICE_URL: http://ink-ms-users:3002
    depends_on:
      mysql-admin:
        condition: service_healthy
      ink-ms-users:
        condition: service_started
    networks:
      - inklusport-net
    restart: unless-stopped

  ink-ms-accessibility:
    profiles: ["full"]
    build:
      context: .
      dockerfile: ink-ms-accesibility/Dockerfile
    container_name: ink-ms-accessibility
    ports:
      - "3004:3004"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGODB_URI: mongodb://mongo:27017/accessibility_notifications_db
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - inklusport-net
    restart: unless-stopped

  ai-assistant-ms:
    profiles: ["full"]
    build:
      context: ./ai-assistant-ms
      dockerfile: Dockerfile
    container_name: ai-assistant-ms
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGODB_URI: mongodb://mongo:27017/inklusport_ia
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - inklusport-net
    restart: unless-stopped

networks:
  inklusport-net:
    driver: bridge

volumes:
  mysql-auth-data:
  mysql-user-data:
  mysql-sports-data:
  mysql-reports-data:
  mysql-admin-data:
  mongo-data:

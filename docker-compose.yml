version: '3.8'

services:
  # Bases de Datos
  
  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: auth_ms
    ports:
      - "3306:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql
    networks:
      - inklusport-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-user:
    image: mysql:8.0
    container_name: mysql-user
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: user_ms
    ports:
      - "3307:3306"
    volumes:
      - mysql-user-data:/var/lib/mysql
    networks:
      - inklusport-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-sports:
    image: mysql:8.0
    container_name: mysql-sports
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: sports_ms
    ports:
      - "3308:3306"
    volumes:
      - mysql-sports-data:/var/lib/mysql
    networks:
      - inklusport-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Micorservicios
  
  ink-ms-auth:
    build: ./ink-ms-auth
    container_name: ink-ms-auth
    ports:
      - "3001:3001"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=mysql-auth
      - DB_PORT=3306
      - DB_NAME=auth_ms
      - DB_USERNAME=root
      - DB_PASSWORD=root123
      - USERS_SERVICE_URL=http://ink-ms-users:3002
    depends_on:
      mysql-auth:
        condition: service_healthy
    networks:
      - inklusport-net
    restart: unless-stopped

  ink-ms-users:
    build: ./ink-ms-users
    container_name: ink-ms-users
    ports:
      - "3002:3002"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=mysql-user
      - DB_PORT=3306
      - DB_NAME=user_ms
      - DB_USERNAME=root
      - DB_PASSWORD=root123
      - AUTH_SERVICE_URL=http://ink-ms-auth:3001
    depends_on:
      mysql-user:
        condition: service_healthy
      ink-ms-auth:
        condition: service_started
    networks:
      - inklusport-net
    restart: unless-stopped

  ink-ms-sports:
    build: ./ink-ms-sports
    container_name: ink-ms-sports
    ports:
      - "3003:3003"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=mysql-sports
      - DB_PORT=3306
      - DB_NAME=sports_ms
      - DB_USERNAME=root
      - DB_PASSWORD=root123
    depends_on:
      mysql-sports:
        condition: service_healthy
    networks:
      - inklusport-net
    restart: unless-stopped

  ink-ms-gateway:
    build: ./ink-ms-gateway
    container_name: ink-ms-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - ink-ms-auth
      - ink-ms-users
      - ink-ms-sports
    networks:
      - inklusport-net
    restart: unless-stopped

networks:
  inklusport-net:
    driver: bridge

volumes:
  mysql-auth-data:
  mysql-user-data:
  mysql-sports-data:
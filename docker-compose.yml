version: "3.8"

networks:
  inklusport-network:
    driver: bridge

services:
  # ==========================================
  # 1. BASES DE DATOS
  # ==========================================
  mongodb:
    image: mongo:6.0
    container_name: inklusport-mongodb
    restart: always
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - inklusport-network

  mysql:
    image: mysql:8.0
    container_name: inklusport-mysql
    restart: always
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-mysql:/docker-entrypoint-initdb.d
    networks:
      - inklusport-network

  # ==========================================
  # 2. MICROSERVICIOS
  # ==========================================
  auth-service:
    build:
      context: ./backend/ink-ms-auth
      dockerfile: Dockerfile
    container_name: ink-ms-auth
    ports:
      - "${AUTH_PORT}:3001"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    depends_on:
      - mysql
    networks:
      - inklusport-network

  users-service:
    build:
      context: ./backend/ink-ms-users
      dockerfile: Dockerfile
    container_name: ink-ms-users
    ports:
      - "${USERS_PORT}:3002"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - mysql
    networks:
      - inklusport-network

  sports-service:
    build:
      context: ./backend/ink-ms-sports
      dockerfile: Dockerfile
    container_name: ink-ms-sports
    ports:
      - "${SPORTS_PORT}:3003"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - mysql
    networks:
      - inklusport-network

  accessibility-service:
    build:
      context: ./backend/ink-ms-accesibility
      dockerfile: Dockerfile
    container_name: ink-ms-accessibility
    ports:
      - "${ACCESSIBILITY_PORT}:3004"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DATABASE}?authSource=admin
      SPRING_DATA_MONGODB_DATABASE: ${MONGO_DATABASE}
    depends_on:
      - mongodb
    networks:
      - inklusport-network

  reports-service:
    build:
      context: ./backend/ink-ms-reports
      dockerfile: Dockerfile
    container_name: ink-ms-reports
    ports:
      - "${REPORTS_PORT}:3006"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - mysql
    networks:
      - inklusport-network

  ai-service:
    build:
      context: ./backend/ink-ms-ai-assistant
      dockerfile: Dockerfile
    container_name: ink-ms-ai
    ports:
      - "${AI_PORT:-3008}:3008"
    environment:
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/
      MONGODB_DB: inclusport_training_ia
      AUTH_SERVICE_URL: http://auth-service:3001
      USERS_SERVICE_URL: http://users-service:3002
      SPORTS_SERVICE_URL: http://sports-service:3003
      GROK_API_KEY: ${GROK_API_KEY:-}
      GROK_MODEL: ${GROK_MODEL:-grok-4.5}
      GROK_API_URL: ${GROK_API_URL:-https://api.x.ai/v1/chat/completions}
    depends_on:
      - mongodb
      - users-service
      - sports-service
    networks:
      - inklusport-network

  gateway-service:
    build:
      context: ./backend/ink-ms-gateway
      dockerfile: Dockerfile
    container_name: ink-ms-gateway
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: auth-service
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://auth-service:3001
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/api/auth/**
      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: users-service
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://users-service:3002
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/api/users/**
    depends_on:
      - auth-service
      - users-service
    networks:
      - inklusport-network

# ==========================================
# VOLUMENES PERSISTENTES
# ==========================================
volumes:
  mysql_data:
  mongodb_data:
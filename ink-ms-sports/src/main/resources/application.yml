spring:
  application:
    name: ink-ms-sports
  
  datasource:
    url: jdbc:mysql://localhost:3306/sports_events_ms?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jackson:
    serialization:
      fail-on-empty-beans: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 3003

app:
  jwt:
    secret: inklusport2024superSecretKeyForJWTtokenGenerationWith512bitsAlgorithmHS512
    expiration: 86400000

users:
  service:
    url: http://localhost:3002

accessibility:
  service:
    url: http://localhost:3004

logging:
  level:
    com.inklusport.sports: DEBUG
    org.springframework.security: DEBUG
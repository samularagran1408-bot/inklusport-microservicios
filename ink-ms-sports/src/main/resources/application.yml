# ============================================================
# application.yml - ink-ms-sports
# ============================================================

spring:
  application:
    name: ink-ms-sports

  datasource:
    url: ${DB_URL}
    username: ${USER_NAME}
    password: ${USER_PASSWORD}
    driver-class-name: ${DRIVER_CLASS}

  jackson:
    serialization:
      fail-on-empty-beans: ${FAIL_ON_EMPTY:false}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        dialect: ${DIALECT:org.hibernate.dialect.MySQL8Dialect}
        format_sql: ${FORMAT_SQL:true}

  flyway:
    enabled: ${ENABLED:true}
    baseline-on-migrate: ${BASELINE:true}
    locations: ${LOCATIONS:classpath:db/migration}

server:
  port: ${SERVER_PORT}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}  

users:
  service:
    url: ${USERS_SERVICE_URL}

accessibility:
  service:
    url: ${ACCESSIBILITY_SERVICE_URL}

logging:
  level:
    com.inklusport.sports: ${LOG_LEVEL:DEBUG}
    org.springframework.security: ${LOG_LEVEL:DEBUG}
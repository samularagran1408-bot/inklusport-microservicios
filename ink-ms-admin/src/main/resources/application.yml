server:
  port: 3005

spring:
  application:
    name: ink-ms-admin 
  
  datasource:
    url: jdbc:mysql://localhost:3306/admin_ms?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
    username: root 
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari: 
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true 
    open-in-view: false 
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true 
        highlight_sql: true 
        jackson:
          serialization:
            fail-on-empty-beans: false

security:
  jwt:
    secret: "5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437" 
    expiration: 86400000 

users:
  service:
    url: http://localhost:3002

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
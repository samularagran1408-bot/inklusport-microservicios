spring:
  application:
    name: ink-ms-users
  
  datasource:
    url: jdbc:mysql://mysql:3306/user_ms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update  
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 3002

logging:
  level:
    com.inklusport.users: DEBUG
    org.springframework.web: INFO

# URL del auth-service (para validar tokens)
auth:
  service:
    url: http://auth-service:3001
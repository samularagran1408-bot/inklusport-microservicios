spring:
  application:
    name: ink-ms-ai-assistant

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ai_chatbot_db}
      auto-index-creation: true

server:
  port: ${SERVER_PORT:3008}

jwt:
  secret: ${JWT_SECRET:inklusport2024superSecretKeyForJWTtokenGenerationWith512bitsAlgorithmHS512}
  expiration: ${JWT_EXPIRATION:86400000}

huggingface:
  api:
    key: ${HUGGINGFACE_API_KEY:}
    model: ${HUGGINGFACE_MODEL:meta-llama/Llama-3.1-8B-Instruct:fastest}
    temperature: ${HUGGINGFACE_TEMPERATURE:0.7}
    max-tokens: ${HUGGINGFACE_MAX_TOKENS:1024}
    base-url: ${HUGGINGFACE_BASE_URL:https://router.huggingface.co/v1}

logging:
  level:
    com.inklusport.ai: ${LOG_LEVEL:DEBUG}
    org.springframework.security: INFO
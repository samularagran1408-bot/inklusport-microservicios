spring:
  application:
    name: ink-ms-reports
  
  datasource:
    url: jdbc:mysql://localhost:3306/analytics_ms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 3006

jwt:
  secret: inklusport2024superSecretKeyForJWTtokenGenerationWith512bitsAlgorithmHS512
  expiration: 86400000

users:
  service:
    url: http://localhost:3002

sports:
  service:
    url: http://localhost:3003

accessibility:
  service:
    url: http://localhost:3004

logging:
  level:
    com.inklusport.reports: DEBUG
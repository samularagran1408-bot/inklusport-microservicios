# src/main/resources/application.yml

spring:
  application:
    name: sports-events-ms
  
  datasource:
    url: jdbc:mysql://localhost:3308/sports_events_ms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 3003

logging:
  level:
    com.inklusport.sports: DEBUG
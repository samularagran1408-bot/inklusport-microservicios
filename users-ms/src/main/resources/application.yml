# src/main/resources/application.yml

spring:
  application:
    name: users-ms
  
  datasource:
    url: jdbc:mysql://localhost:3306/users_ms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 3002

jwt:
  secret: ${JWT_SECRET:inklusport2024superSecretKeyForJWTtokenGenerationWith512bitsAlgorithmHS512}
  expiration: 86400000

logging:
  level:
    com.inklusport.users: DEBUG

# URL del Auth MS (para Feign Client)
auth:
  service:
    url: http://localhost:3001